# Cấu hình vosu — copy thành `config.yaml` rồi sửa.
# Thứ tự ưu tiên: mặc định trong code < file này < biến môi trường VOSU_*
#
# Biến môi trường dùng `__` để xuống cấp:
#   VOSU_LLM__PORT=9090          -> llm.port
#   VOSU_TTS__ENABLED=false      -> tts.enabled
#   VOSU_PLATFORM=cuda           -> ép build (bỏ qua auto-detect)

# null = tự nhận diện (cuda nếu có nvidia-smi, macos trên Darwin, cpu còn lại)
platform: null

paths:
  models_dir: models
  whisper_model: small           # Qwen3.5-4B Q4_K_M. Bản 2B dịch thiếu ý và đảo nghĩa; 4B đo được 100% yếu
  # tố giữ lại so với 94%, và 0 câu đảo nghĩa. Đổi lại chậm hơn ~2-3 lần và
  # nặng thêm ~790MB.
  #
  # CẢNH BÁO CHO BUILD CUDA: RSS 2830MB. Cộng Whisper `small` (~1.8GB) + KV
  # (~0.5GB) + CUDA overhead (~0.8GB) = ~5.9GB, VƯỢT trần 5.5GB của §3.1.
  # Muốn dùng 4B trên GPU 6GB thì phải hạ `whisper_model` xuống `base`.
  llm_gguf: models/qwen3.5-4b-q4_k_m.gguf
  llama_server_bin: models/llama-server
  piper_bin: piper
  piper_voice_vi: models/piper/vi_VN-vais1000-medium.onnx
  piper_voice_en: models/piper/en_US-lessac-medium.onnx
  silero_vad_onnx: models/silero_vad.onnx

vad:
  backend: silero                # silero | energy (energy = fallback, không cần model)
  threshold: 0.5
  # Ngưỡng im lặng để chốt câu — CỘNG THẲNG vào E2E.
  #
  # Đo thật: ở 400ms, ngừng giữa câu 500ms là bị cắt đôi và người nói chậm bị
  # cắt làm ba. Ở 900ms chỉ còn gộp nhầm khi hai câu cách nhau 400ms (ngắn bất
  # thường). Cắt nhầm giữa câu tệ hơn gộp: nó cho ra bản dịch của một mảnh câu.
  #
  #   ngưỡng   cắt nhầm   gộp nhầm
  #     400        4          0
  #     900        1          1     <- đang dùng
  #    1000        0          2
  min_silence_ms: 900
  min_speech_ms: 200

chunker:
  # §2.2: đây CHỈ là ngưỡng tối thiểu để kích hoạt partial STT.
  # KHÔNG phải speech boundary — final STT luôn do VAD endpoint kích hoạt.
  min_partial_window_s: 1.5
  partial_cooldown_s: 0.8        # chặn sliding-window quá dày (GPU 6GB)
  max_utterance_s: 30.0
  enable_partial: true

stt:
  beam_size: 1
  language: null                 # null = tự nhận diện (LID)
  vad_filter: false              # VAD đã làm ở tầng audio/, đừng làm hai lần
  # --- gộp câu bị ngắt giữa chừng ---
  #
  # Chỉ đo độ dài khoảng lặng thì KHÔNG tách được "ngập ngừng giữa câu" với
  # "đã nói xong". Đo thật: khoảng ngập ngừng giữa câu của người nói chậm
  # (800ms) còn DÀI HƠN khoảng nghỉ giữa hai câu của người nói bình thường
  # (700ms) — không có ngưỡng thời gian nào đúng cho cả hai.
  #
  # Nên xét thêm NỘI DUNG transcript (backend/app/ai/completeness.py): nghe ra
  # câu còn dở thì giữ lại, chờ xem có nói tiếp không rồi ghép audio và nghe
  # lại. Đo trên bộ thử ngập ngừng thật:
  #
  #     bắt được câu dở          11/12 (92%)
  #     không giữ nhầm câu trọn  32/32 (100%)
  #
  # Hai phía không tốn ngang nhau, và ngưỡng cố ý nghiêng theo: bỏ sót câu dở
  # thì người dùng nhận bản dịch của MỘT MẢNH câu; giữ nhầm câu trọn thì chỉ
  # chậm thêm một nhịp rồi vẫn ra đúng.
  merge_incomplete: true
  # Chờ nghe thêm ngần này (ĐỒNG HỒ AUDIO, không phải đồng hồ thật) mà không
  # ai nói tiếp thì dịch nguyên câu dở — người ta có quyền bỏ lửng câu.
  #
  # Phải đo bằng đồng hồ audio: chế độ dừng-từng-câu dừng file ngay tại
  # endpoint, nên trong lúc chờ KHÔNG có audio nào chạy. Đo bằng đồng hồ thật
  # thì cửa sổ tự hết giờ và câu không bao giờ được ghép.
  merge_window_ms: 1200
  # Backstop bằng đồng hồ thật, phòng khi client ngừng gửi audio hẳn.
  merge_backstop_s: 15.0
  # Chặn heuristic đọc sai liên tục làm câu dài vô hạn.
  max_merges: 2
  max_merged_s: 20.0

llm:
  host: 127.0.0.1
  port: 8080
  n_ctx: 2048
  # Bản dịch KĨ dài hơn bản dịch lược, và câu nhiều mệnh đề cần chỗ.
  n_predict: 160
  # 0 = greedy. Dịch không cần sáng tạo, và greedy cho kết quả TÁI LẬP ĐƯỢC —
  # ở 0.1 cùng cấu hình đo ra 80/83/86% qua ba lần chạy, mọi so sánh A/B đều
  # nằm trong nhiễu.
  # ĐÃ ĐO: bốn tham số dưới đây KHÔNG phải nguyên nhân của việc thiếu tiểu từ
  # tình thái (nhé/ạ/thôi/nhỉ) trong bản dịch tiếng Việt.
  #
  # Nghi ngờ hợp lý: temperature 0 luôn chọn token xác suất cao nhất, mà tiểu
  # từ là thành phần TÙY CHỌN; repeat_penalty phạt token đã xuất hiện, mà tiểu
  # từ ngắn và hay lặp; n_predict cắt từ CUỐI câu, mà tiểu từ nằm cuối câu.
  # Đo từng cái trên 26 ca (benchmarks/fidelity.py):
  #
  #   cấu hình                yếu tố   thiếu ý   thiếu tiểu từ
  #   temp 0 (đang dùng)      60/62      2/26        4/5
  #   repeat_penalty 1.0      60/62      2/26        4/5
  #   grammar tắt             60/62      2/26        4/5
  #   n_predict 400           60/62      2/26        4/5
  #   temp 0.3 (hai lần)      59, 60     3, 2        4/5, 4/5
  #   temp 0.7 (hai lần)      58, 60     4, 2        5/5, 4/5
  #
  # Không cái nào đụng được vào cột cuối. Nâng temperature còn làm TỆ ĐI: nó
  # sinh ra "bỏ aside", "mối lo đáng lẽ ra", "Anh có phiền để anh chờ đợi" —
  # loạn tiếng Việt chứ không tự nhiên hơn. Và chênh lệch 58-60 giữa các lần
  # chạy chính là mức nhiễu mà temperature 0 sinh ra để tránh.
  #
  # Bản dịch dài nhất 126 ký tự, mức cắt của n_predict=160 là ~480 — chưa bao
  # giờ có câu nào bị cắt.
  #
  # Kết luận: thiếu tiểu từ là GIỚI HẠN NĂNG LỰC MODEL, không phải do cấu hình.
  # Đừng chỉnh lại mấy số này với hy vọng chữa được nó.
  temperature: 0.0
  n_gpu_layers: null             # null = lấy từ device profile (CUDA 36, Metal 99)
  # auto | chatml | gemma | qwen3 — "auto" suy từ tên file GGUF.
  # Dự án chỉ dùng Qwen3.5-4B (-> qwen3). Các template khác giữ lại để "auto"
  # vẫn chọn đúng nếu ai đó trỏ config sang model khác.
  # Dùng sai template thì model vẫn sinh chữ, chỉ là chất lượng tệ đi khó
  # truy vết; không có lỗi nào được ném ra.
  prompt_template: auto
  # Giữ toàn bộ KV cache — BẮT BUỘC với Gemma 3 (sliding-window attention).
  # Thiếu cờ này, mỗi utterance phải xử lý lại toàn bộ system prompt:
  # 241 token/610ms thay vì 15 token/86ms. No-op với model không dùng SWA.
  # Ràng buộc output bằng GBNF grammar. Không phải tối ưu hóa — JSON Schema
  # chỉ kiểm soát cấu trúc, không cấm được `}` hay dấu ngoặc cong BÊN TRONG
  # chuỗi. Đo với prompt có lịch sử: json_schema 0/6 sạch, GBNF 6/6.
  grammar: true
  # Chống lặp: model từng kẹt sinh `”}”}”}...` tới hết n_predict.
  repeat_penalty: 1.15
  swa_full: true
  # Bộ nhớ hội thoại (§10). 0 = tắt, mỗi câu dịch biệt lập.
  history_turns: 6
  history_chars: 1200
  startup_timeout_s: 90.0

tts:
  enabled: true
  voice: vi
  # §2.4.1 MVP scope — chốt để tránh audio dồn dập chồng lấp hội thoại thật.
  # Trường `intent` của §4.4 đã bỏ: người dùng chỉ cần bản dịch.
  auto_read_translation: true
  # Cắt lời đang đọc khi nghe thấy tiếng nói mới (§2.4.1 Barge-in).
  #
  # MẶC ĐỊNH TẮT — sai lệch có chủ ý so với đặc tả. Barge-in dành cho tình
  # huống NGƯỜI DÙNG nói đè lên bản đọc. Nhưng vòng lặp chính của sản phẩm này
  # là NGHE ĐỐI PHƯƠNG, và với một mic thì tiếng nói mới thường là họ nói tiếp.
  #
  # Đo thật trên đoạn nói nhanh (nghỉ 0.9s giữa câu): 2 trong 6 bản dịch bị
  # cắt, một câu bị cắt khi chưa đọc được chữ nào. Bật lại khi nguồn audio là
  # mic của chính người dùng và bạn cần họ ngắt lời được; B8 vẫn đo được.
  barge_in: false
  # Số bản dịch tối đa xếp hàng chờ đọc. Đọc một câu mất ~2.5-3s; nếu người ta
  # ra câu mới nhanh hơn thế thì phần đọc tụt lại mãi. Vượt hạn thì bỏ bản CŨ
  # NHẤT (đã lạc hậu so với cuộc nói chuyện) và BÁO ra client.
  max_pending_reads: 4    # AUTO — giá trị cốt lõi khi nghe live
  # Tốc độ đọc khi dịch NGƯỢC (bạn nói tiếng Việt -> đọc tiếng đối phương).
  # Chậm hơn hẳn vì bạn phải nói theo, không chỉ nghe hiểu. Lớn hơn = chậm hơn.
  coach_length_scale: 1.35
  stream_by_sentence: true
  # Đẩy chunk theo nhịp thời gian thực. Tắt đi thì server dốc hết audio sang
  # client ngay lập tức và mất khả năng hủy giữa chừng (§2.4.1).
  realtime_pacing: true
  pacing_lead_ms: 250

vram:
  expected_gb: 5.0
  hard_ceiling_gb: 5.5           # §3.1 — vượt thì degrade/reject/unload
  on_exceed: warn                # warn | reject

session:
  # Ngôn ngữ CỦA BẠN. Whisper nhận diện ra tiếng này thì hiểu là bạn đang nói,
  # và dịch NGƯỢC sang tiếng đối phương rồi đọc chậm để bạn nói theo.
  user_language: vi
  # Tiếng đối phương — chỉ là mặc định ban đầu; sau khi nghe họ nói lần đầu
  # thì lấy theo ngôn ngữ thật nghe được.
  counterpart_language: en
  max_concurrent_sessions: 1     # §10 — 6GB chỉ đủ phục vụ tốt 1 client
  idle_timeout_s: 180.0

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
