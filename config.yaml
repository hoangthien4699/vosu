# Cấu hình nhánh `release` — build NVIDIA/CUDA.
#
# Đây là build MỤC TIÊU của đặc tả và là build duy nhất được dùng để chốt
# Benchmark Gate (§6). Ghi đè cục bộ: đặt biến VOSU_* hoặc sửa file này
# (thay đổi sẽ hiện trong `git status` — cố ý, để không lệch cấu hình mà
# không ai biết).

platform: cuda

paths:
  models_dir: models
  # §3.1 — MVP ưu tiên Small, không mặc định lên Medium. Bài toán là
  # "đủ nhanh và đủ chính xác để LLM hiểu intent", không phải "chính xác
  # tuyệt đối". Chỉ nâng nếu benchmark cho thấy Small thực sự không đủ.
  whisper_model: small
  # Qwen3.5-4B Q4_K_M — 4B hết lỗi đảo nghĩa mà 2B mắc phải.
  #
  # CẢNH BÁO VRAM: RSS 2830MB. Cộng Whisper `small` (~1.8GB) + KV (~0.5GB) +
  # CUDA overhead (~0.8GB) = ~5.9GB, VƯỢT trần 5.5GB của §3.1.
  # Muốn dùng 4B trên GPU 6GB thì phải chọn một trong hai, KHÔNG có lựa chọn
  # nào miễn phí:
  #
  #   a) hạ whisper_model xuống `base` (tổng còn ~5.1GB) — nhưng đo WER trên
  #      20 câu Anh/Việt thì `base` tệ hơn hẳn, và càng ồn càng giãn:
  #
  #          SNR       base    small
  #          sạch      5.3%     1.1%
  #          20dB      9.1%     1.1%   <- phòng họp bình thường
  #          10dB     14.4%     8.0%
  #           5dB     27.8%    16.6%
  #
  #      `base` nghe nhầm kiểu "thanh toán" -> "thang tòa án", "bàn giao" ->
  #      "bàn dào". Nghe nhầm từ khoá rồi dịch sai hẳn nghĩa — tệ hơn nhiều so
  #      với dịch hơi cứng.
  #
  #   b) quay lại models/qwen3.5-2b-q8_0.gguf và chấp nhận lỗi đảo nghĩa.
  #
  # Nghe sai thì dịch gì cũng sai, nên (b) đáng cân nhắc trước (a).
  # CHẠY benchmarks/b4_vram.py để có số thật trước khi chốt.
  llm_gguf: models/qwen3.5-4b-q4_k_m.gguf
  llama_server_bin: models/llama-server
  piper_bin: piper
  piper_voice_vi: models/piper/vi_VN-vais1000-medium.onnx
  piper_voice_en: models/piper/en_US-lessac-medium.onnx
  silero_vad_onnx: models/silero_vad.onnx

vad:
  backend: silero
  threshold: 0.5
  # Ngưỡng im lặng để chốt câu — CỘNG THẲNG vào E2E.
  # Đo thật: 400ms cắt nhầm giữa câu 4 lần / gộp nhầm 0; 900ms là 1/1.
  # Nhưng gộp nhầm hoá ra tệ hơn tôi tưởng: file 13.8s ba câu thoại ra ĐÚNG
  # MỘT utterance, bản dịch chỉ hiện ở giây thứ 11 — người dùng thấy như phần
  # mềm đọc hết đoạn rồi mới xử lý. Nên 900ms chỉ còn là ngưỡng cho câu NGẮN;
  # câu đã dài thì dùng min_silence_after_ms bên dưới.
  min_silence_ms: 900        # §7 — cộng thẳng vào E2E, đừng hạ xuống 150ms
  # Ngưỡng ngắn khi câu đã nói dài hơn long_utterance_s.
  # Ngưỡng cố định thì hoặc cắt nhầm người nói chậm, hoặc gộp
  # nhiều câu thành một khối và người dùng đợi hết đoạn mới thấy gì.
  min_silence_after_ms: 550
  long_utterance_s: 2.5
  min_speech_ms: 200

chunker:
  min_partial_window_s: 1.5  # ngưỡng partial, KHÔNG phải speech boundary
  partial_cooldown_s: 0.8
  enable_partial: true

stt:
  # beam 5 gần như không hơn: 8.0% -> 7.5% ở 10dB, đổi lấy +180ms. Không đáng.
  beam_size: 1
  # null = Whisper tự nhận diện ngôn ngữ, cần cho việc xác định chiều dịch.
  #
  # Ghim sẵn ngôn ngữ thì nhanh gần gấp đôi (khỏi chạy encoder lượt hai), nhưng
  # ta không biết trước ai sắp nói. Đã thử dò bằng model `tiny` rồi ghim cho
  # `small`: bỏ, vì có nhiễu thì tiny dò đúng 95% còn small 100% — cứ 20 câu
  # sai ngôn ngữ 1 câu là hỏng nguyên câu đó.
  language: null
  # Chỉ có tác dụng khi STT chạy CPU. Build CUDA để 0.
  cpu_threads: 0

llm:
  host: 127.0.0.1
  port: 8080
  n_ctx: 2048
  # Bản dịch KĨ dài hơn bản dịch lược.
  n_predict: 160
  # 0 = greedy. Dịch không cần sáng tạo, và greedy cho kết quả TÁI LẬP ĐƯỢC —
  # ở 0.1 cùng cấu hình đo ra 80/83/86%, mọi so sánh A/B nằm trong nhiễu.
  temperature: 0.0
  n_gpu_layers: null         # null -> DeviceProfile cuda = 36
  prompt_template: auto      # auto suy từ tên file GGUF
  # BẮT BUỘC với Gemma 3 (sliding-window attention): thiếu cờ này thì mỗi
  # utterance xử lý lại toàn bộ system prompt, TTFT tệ đi 7 lần.
  # Ràng buộc output bằng GBNF grammar. JSON Schema chỉ kiểm soát cấu trúc,
  # không cấm được `}` hay dấu ngoặc cong BÊN TRONG chuỗi: 0/6 vs 6/6 sạch.
  grammar: true
  # Chống lặp: model từng kẹt sinh `”}”}”}...` tới hết n_predict.
  repeat_penalty: 1.15
  # Dịch lại một lần khi phát hiện bản dịch hỏng (chép nguyên văn / sai ngôn
  # ngữ). Model 2B thỉnh thoảng chép thay vì dịch.
  retry_on_bad_translation: true
  swa_full: true
  # Bộ nhớ hội thoại (§10). 0 = tắt, mỗi câu dịch biệt lập.
  history_turns: 6
  history_chars: 1200

tts:
  enabled: true
  voice: vi
  auto_read_translation: true
  # Tốc độ đọc chiều NGƯỢC (bạn nói tiếng Việt -> đọc tiếng đối phương).
  # Chậm hơn hẳn vì bạn phải nói theo. Lớn hơn = chậm hơn.
  coach_length_scale: 1.35
  stream_by_sentence: true
  realtime_pacing: true

vram:
  expected_gb: 5.0
  hard_ceiling_gb: 5.5       # §3.1 — hard ceiling thật, GPU 6GB
  on_exceed: warn            # đổi sang `reject` nếu muốn từ chối phiên mới

session:
  # Ngôn ngữ CỦA BẠN. Whisper nhận ra tiếng này thì hiểu là bạn đang nói và
  # dịch NGƯỢC sang tiếng đối phương rồi đọc chậm để bạn nói theo.
  user_language: vi
  # Chỉ là mặc định ban đầu; sau khi nghe họ nói thì lấy theo thực tế.
  counterpart_language: en
  max_concurrent_sessions: 1
  idle_timeout_s: 180.0

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
