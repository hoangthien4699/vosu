# Cấu hình nhánh `release` — build NVIDIA/CUDA.
#
# Đây là build MỤC TIÊU của đặc tả và là build duy nhất được dùng để chốt
# Benchmark Gate (§6). Ghi đè cục bộ: đặt biến VOSU_* hoặc sửa file này
# (thay đổi sẽ hiện trong `git status` — cố ý, để không lệch cấu hình mà
# không ai biết).

platform: cuda

paths:
  models_dir: models
  # §3.1 — MVP ưu tiên Small, không mặc định lên Medium. Bài toán là
  # "đủ nhanh và đủ chính xác để LLM hiểu intent", không phải "chính xác
  # tuyệt đối". Chỉ nâng nếu benchmark cho thấy Small thực sự không đủ.
  whisper_model: small
  # Qwen3.5-2B Q8_0. Q8 chứ không phải Q4: model 2B nhỏ nên lượng tử hóa
  # 4-bit làm hụt chất lượng dịch rõ hơn model lớn. Nhẹ hơn Gemma 3 4B Q4
  # khoảng 500MB VRAM — khác biệt giữa "còn dự phòng" và "sát mép trần 5.5GB".
  llm_gguf: models/qwen3.5-2b-q8_0.gguf
  llama_server_bin: models/llama-server
  piper_bin: piper
  piper_voice_vi: models/piper/vi_VN-vais1000-medium.onnx
  piper_voice_en: models/piper/en_US-lessac-medium.onnx
  silero_vad_onnx: models/silero_vad.onnx

vad:
  backend: silero
  threshold: 0.5
  min_silence_ms: 400        # §7 — cộng thẳng vào E2E, đừng hạ xuống 150ms
  min_speech_ms: 200

chunker:
  min_partial_window_s: 1.5  # ngưỡng partial, KHÔNG phải speech boundary
  partial_cooldown_s: 0.8
  enable_partial: true

stt:
  beam_size: 1
  language: null

llm:
  host: 127.0.0.1
  port: 8080
  n_ctx: 2048
  n_predict: 96
  temperature: 0.2
  n_gpu_layers: null         # null -> DeviceProfile cuda = 36
  prompt_template: auto      # auto suy từ tên file GGUF
  # BẮT BUỘC với Gemma 3 (sliding-window attention): thiếu cờ này thì mỗi
  # utterance xử lý lại toàn bộ system prompt, TTFT tệ đi 7 lần.
  # Ràng buộc output bằng GBNF grammar. JSON Schema chỉ kiểm soát cấu trúc,
  # không cấm được `}` hay dấu ngoặc cong BÊN TRONG chuỗi: 0/6 vs 6/6 sạch.
  grammar: true
  # Chống lặp: model từng kẹt sinh `”}”}”}...` tới hết n_predict.
  repeat_penalty: 1.15
  swa_full: true
  # Bộ nhớ hội thoại (§10). 0 = tắt, mỗi câu dịch biệt lập.
  history_turns: 6
  history_chars: 1200

tts:
  enabled: true
  voice: vi
  auto_read_translation: true
  # Tốc độ đọc chiều NGƯỢC (bạn nói tiếng Việt -> đọc tiếng đối phương).
  # Chậm hơn hẳn vì bạn phải nói theo. Lớn hơn = chậm hơn.
  coach_length_scale: 1.35
  stream_by_sentence: true
  realtime_pacing: true

vram:
  expected_gb: 5.0
  hard_ceiling_gb: 5.5       # §3.1 — hard ceiling thật, GPU 6GB
  on_exceed: warn            # đổi sang `reject` nếu muốn từ chối phiên mới

session:
  # Ngôn ngữ CỦA BẠN. Whisper nhận ra tiếng này thì hiểu là bạn đang nói và
  # dịch NGƯỢC sang tiếng đối phương rồi đọc chậm để bạn nói theo.
  user_language: vi
  # Chỉ là mặc định ban đầu; sau khi nghe họ nói thì lấy theo thực tế.
  counterpart_language: en
  max_concurrent_sessions: 1
  idle_timeout_s: 180.0

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
