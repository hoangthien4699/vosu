# Cấu hình nhánh `release-mac` — build macOS (Apple Silicon).
#
# PHẠM VI SỬ DỤNG: phát triển và kiểm thử logic pipeline.
# KHÔNG dùng nhánh này để chốt Benchmark Gate — đặc tả §6 yêu cầu GPU NVIDIA
# 6GB. `benchmarks/run_gate.py` sẽ in cảnh báo đậm nếu bạn thử.

platform: macos

paths:
  models_dir: models
  # `base` chứ không phải `small` như bản CUDA.
  #
  # CTranslate2 (backend của faster-whisper) KHÔNG có backend Metal/MPS, nên
  # STT chạy CPU. Đo trên M4: base ~640ms, small chậm hơn đáng kể. Với mục
  # đích phát triển, `base` giữ vòng lặp thử-sai ở mức chịu được.
  # Đổi sang `small` nếu cần đối chiếu chất lượng với bản CUDA.
  # Đo WER trên 20 câu Anh/Việt (giọng máy, nên số tuyệt đối là LẠC QUAN;
  # chỉ dùng để so cấu hình). `base` nghe nhầm đúng kiểu người dùng phàn nàn:
  # "giảm giá"->"giảm giả", "thanh toán"->"thang tòa án", "bàn giao"->"bàn dào".
  #
  #   SNR       base    small
  #   sạch      5.3%     1.1%
  #   20dB      9.1%     1.1%     <- phòng họp bình thường
  #   10dB     14.4%     8.0%
  #    5dB     27.8%    16.6%
  #
  # Đổi lại chậm hơn ~1.1s mỗi câu trên CPU Mac. Nghe nhầm một từ khoá rồi
  # dịch sai hẳn nghĩa tệ hơn nhiều so với chậm thêm một giây.
  whisper_model: small
  # Qwen3.5-4B Q4_K_M. Bản 2B dịch thiếu ý và đảo nghĩa; 4B đo được 100% yếu
  # tố giữ lại so với 94%, và 0 câu đảo nghĩa. Đổi lại chậm hơn ~2-3 lần và
  # nặng thêm ~790MB.
  #
  # Model DUY NHẤT của dự án — đã bỏ hẳn Qwen3.5-2B, Gemma 3 4B và Qwen2.5-3B
  # để ưu tiên chất lượng dịch. Xem models/README.md.
  #
  # CẢNH BÁO CHO BUILD CUDA: RSS 2830MB. Cộng Whisper `small` (~1.8GB) + KV
  # (~0.5GB) + CUDA overhead (~0.8GB) = ~5.9GB, VƯỢT trần 5.5GB của §3.1.
  # Trước có hai đường lui — hạ Whisper xuống `base`, hoặc quay về 2B — nay bỏ
  # cả hai vì đều đánh đổi bằng chất lượng. Nghĩa là build CUDA cần card 8GB.
  llm_gguf: models/qwen3.5-4b-q4_k_m.gguf
  # brew install llama.cpp, rồi scripts/download_models.sh tự liên kết vào đây
  llama_server_bin: models/llama-server
  # Homebrew KHÔNG có formula `piper` — cài bằng `pip install piper-tts`,
  # binary nằm trong venv. Trỏ thẳng vào đó để `make run` chạy được mà không
  # cần activate venv trước.
  piper_bin: .venv/bin/piper
  piper_voice_vi: models/piper/vi_VN-vais1000-medium.onnx
  piper_voice_en: models/piper/en_US-lessac-medium.onnx
  silero_vad_onnx: models/silero_vad.onnx

vad:
  backend: silero
  threshold: 0.5
  # Ngưỡng im lặng để chốt câu — CỘNG THẲNG vào E2E.
  #
  # Đo thật: ở 400ms, ngừng giữa câu 500ms là bị cắt đôi và người nói chậm bị
  # cắt làm ba. Ở 900ms chỉ còn gộp nhầm khi hai câu cách nhau 400ms (ngắn bất
  # thường). Cắt nhầm giữa câu tệ hơn gộp: nó cho ra bản dịch của một mảnh câu.
  #
  #   ngưỡng   cắt nhầm   gộp nhầm
  #     400        4          0
  #     900        1          1
  #    1000        0          2
  #
  # Nhưng gộp nhầm hoá ra tệ hơn bảng trên gợi ý: file 13.8s có ba câu thoại
  # ra ĐÚNG MỘT utterance, bản dịch chỉ hiện ở giây thứ 11 — người dùng thấy
  # như phần mềm đọc hết đoạn rồi mới xử lý, thay vì dịch từng câu.
  #
  # Nên 900ms giờ chỉ là ngưỡng cho câu NGẮN.
  min_silence_ms: 900
  # Câu đã nói quá long_utterance_s thì chỉ chờ ngần này. Người ta ngập ngừng
  # ở ĐẦU câu khi đang tìm chữ; nghỉ SAU khi đã nói trọn một ý gần như luôn là
  # hết câu. Quét 400-650ms đều cho kết quả tốt nhất, lấy 550 giữa plateau.
  min_silence_after_ms: 550
  long_utterance_s: 2.5
  min_speech_ms: 200

chunker:
  min_partial_window_s: 1.5
  partial_cooldown_s: 0.8
  # STT trên CPU đắt hơn nhiều so với build CUDA. Partial là TÙY CHỌN (§2.2)
  # nên tắt đi sẽ nhường toàn bộ CPU cho final STT — final vẫn luôn chạy vì
  # nó do VAD endpoint kích hoạt, không phụ thuộc partial.
  # Bật lại nếu muốn thấy transcript hiện dần trong lúc nói.
  # Đo trên Mac (Whisper chạy CPU): bật partial làm STT tranh CPU với câu kế
  # tiếp, độ trễ trượt dần qua từng câu 644 -> 1106 -> 1552ms, chữ dịch đầu
  # tiên chậm từ 2.4s lên 3.5s, và một câu mất hẳn phần đọc. Giữ tắt.
  enable_partial: false

stt:
  # beam 5 gần như không hơn: 8.0% -> 7.5% ở 10dB, đổi lấy +180ms. Không đáng.
  beam_size: 1
  # null = Whisper tự nhận diện ngôn ngữ, cần cho việc xác định chiều dịch.
  #
  # Ghim sẵn ngôn ngữ thì nhanh gần gấp đôi (1094ms so với 2045ms) vì khỏi
  # chạy encoder lượt thứ hai, nhưng ta không biết trước ai sắp nói.
  # Đã thử dùng model `tiny` dò ngôn ngữ trước rồi ghim cho `small`
  # (1198ms, nhanh hơn 560ms): bỏ, vì có nhiễu thì tiny dò đúng 95% còn
  # small 100% — cứ 20 câu sai ngôn ngữ 1 câu là hỏng nguyên câu đó.
  language: null
  # Đo trên Mac 10 nhân: mặc định 2093ms/câu, 8 luồng 1704ms.
  cpu_threads: 8

llm:
  host: 127.0.0.1
  port: 8080
  n_ctx: 2048
  # Bản dịch KĨ dài hơn bản dịch lược, và câu nhiều mệnh đề cần chỗ.
  n_predict: 160
  # 0 = greedy. Dịch không cần sáng tạo, và greedy cho kết quả TÁI LẬP ĐƯỢC —
  # ở 0.1 cùng cấu hình đo ra 80/83/86% qua ba lần chạy, mọi so sánh A/B đều
  # nằm trong nhiễu.
  temperature: 0.0
  n_gpu_layers: null         # null -> DeviceProfile macos = 99 (Metal)
  prompt_template: auto      # auto suy từ tên file GGUF
  # BẮT BUỘC với Gemma 3 (sliding-window attention). Đo trên M4: thiếu cờ này
  # thì mỗi utterance xử lý lại 241 token/610ms thay vì 15 token/86ms.
  # Ràng buộc output bằng GBNF grammar. Không phải tối ưu hóa — JSON Schema
  # chỉ kiểm soát cấu trúc, không cấm được `}` hay dấu ngoặc cong BÊN TRONG
  # chuỗi. Đo với prompt có lịch sử: json_schema 0/6 sạch, GBNF 6/6.
  grammar: true
  # Chống lặp: model từng kẹt sinh `”}”}”}...` tới hết n_predict.
  repeat_penalty: 1.15
  swa_full: true

tts:
  enabled: true
  voice: vi
  auto_read_translation: true
  stream_by_sentence: true
  realtime_pacing: true

vram:
  # Unified memory — hard ceiling 5.5GB của §3.1 KHÔNG áp dụng ở đây, và
  # VramGuard tự thành no-op vì không có nvidia-smi. Giữ số để cấu hình đồng
  # nhất giữa hai nhánh, không phải để enforce.
  expected_gb: 5.0
  hard_ceiling_gb: 5.5
  on_exceed: warn

session:
  # Ngôn ngữ CỦA BẠN. Whisper nhận diện ra tiếng này thì hiểu là bạn đang nói,
  # và dịch NGƯỢC sang tiếng đối phương rồi đọc chậm để bạn nói theo.
  user_language: vi
  # Tiếng đối phương — chỉ là mặc định ban đầu; sau khi nghe họ nói lần đầu
  # thì lấy theo ngôn ngữ thật nghe được.
  counterpart_language: en
  max_concurrent_sessions: 1
  idle_timeout_s: 180.0

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
