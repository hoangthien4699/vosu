name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 là bản tối thiểu khai báo trong pyproject; 3.11 là bản khuyến nghị.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        # Khai báo tường minh thay vì dựa vào Node có sẵn trong image: bước
        # "Chạy thật client JS" bên dưới là thứ duy nhất bắt được lỗi runtime
        # của app.js, im lặng bỏ qua nó thì coi như không có.
        with:
          node-version: "20"

      - name: Cài dependency
        # Cố ý KHÔNG cài faster-whisper/model: bộ test phải chạy được mà không
        # cần GPU hay 2GB model. VAD có backend energy thay thế, STT/LLM/TTS
        # đều có bản giả lập. Nếu phải tải model mới chạy được test thì CI sẽ
        # chậm tới mức không ai để ý khi nó đỏ.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Lint
        run: ruff check backend benchmarks tests

      - name: Test
        run: pytest -q

      - name: Kiểm tra import trên cả hai device profile
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "backend")
          from app.core.config import load_config

          for platform, expected_ngl, expected_stt in [
              ("cuda", 36, "cuda"), ("macos", 99, "cpu"), ("cpu", 0, "cpu"),
          ]:
              cfg = load_config(env={"VOSU_PLATFORM": platform})
              assert cfg.llm_gpu_layers == expected_ngl, platform
              assert cfg.device.stt_device == expected_stt, platform
              print(f"{platform}: ngl={cfg.llm_gpu_layers} stt={cfg.device.stt_device} OK")
          PY

      - name: Kiểm tra script shell
        run: bash -n scripts/*.sh

      - name: Chạy thật client JS
        # `node --check` chỉ bắt lỗi cú pháp. Lỗi tham chiếu biến không tồn tại
        # thì phải CHẠY mới lộ — đã trả giá một lần: `tts_done` ném
        # ReferenceError ngay trước dòng resolve(), làm file dừng 27.6 giây sau
        # mỗi bản dịch. Không test Python nào bắt được vì chúng chép lại luật
        # của client thay vì chạy chính app.js.
        run: |
          node --check client/web_test/app.js
          node tests/client_smoke.mjs client/web_test

      - name: main không được chứa file riêng nhánh release
        # Chiến lược nhánh: config.yaml và BUILD.md CHỈ tồn tại trên release và
        # release-mac. Cherry-pick một commit có đụng chúng sẽ kéo cấu hình của
        # một build sang main — đã xảy ra thật, và merge ngược chiều cũng vậy.
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          for f in config.yaml BUILD.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "LỖI: $f không được nằm trên main — xem phần Nhánh trong README" >&2
              exit 1
            fi
          done
          echo "main sạch file riêng nhánh"

      - name: hai nhánh release chỉ được khác nhau ở file cấu hình
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet origin release release-mac || exit 0
          diverged=$(git diff --name-only origin/release origin/release-mac \
            | grep -E '\.(py|js|html|css)$' || true)
          if [ -n "$diverged" ]; then
            echo "LỖI: code đã phân kỳ giữa hai nhánh release:" >&2
            echo "$diverged" >&2
            exit 1
          fi
          echo "hai nhánh release không phân kỳ code"

      - name: Benchmark phải SKIP sạch khi thiếu model
        # Bắt lỗi kiểu "benchmark nổ vì thiếu dependency" — chúng phải báo
        # SKIP kèm lý do hành động được, không được ném traceback.
        run: |
          python -m benchmarks.run_gate --skip-interactive --no-save || true
          test -f benchmarks/results/gate_report.txt
          grep -q "KẾT LUẬN GATE" benchmarks/results/gate_report.txt
